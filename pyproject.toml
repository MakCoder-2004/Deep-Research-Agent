[project]
name = "deep-research-agent"
version = "0.1.0"
description = "Telegram-accessible Deep Research Agent (LangGraph + LangChain)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langchain>=1.0,<2.0",
  "langchain-core>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "langsmith>=0.3.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "aiogram>=3.0,<4.0",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "tenacity>=8.0",
  "aiosqlite>=0.19",
  "python-dotenv>=1.2.3",
]

[project.scripts]
research-agent = "research_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.hatch.build.targets.sdist]
packages = ["src/research_agent"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.22",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".agents", ".claude", ".venv", ".git", ".mypy_cache", ".ruff_cache", "htmlcov", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
show_error_codes = true
warn_return_any = true
warn_unused_ignores = true
packages = ["research_agent"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/research_agent --cov-report=term-missing"

[tool.coverage.run]
source = ["src/research_agent"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
